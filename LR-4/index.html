<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Случайная фраза</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #phrase {
            font-size: 20px;
            margin-top: 25px;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Генератор случайных фраз</h1>

        <p>Нажми на кнопку, чтобы получить случайную фразу!</p>

        <button id="phraseButton">Показать фразу</button>

        <div id="phrase">Здесь появится фраза</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
